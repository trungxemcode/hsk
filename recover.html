<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khôi phục HSK</title><body style="font:18px system-ui;padding:24px;line-height:1.6"><h2>Khôi phục bộ cập nhật HSK</h2><p id="status">Đang kiểm tra bản sửa… Giữ trang này mở.</p><p>Tiến độ học được giữ nguyên.</p><button onclick="location.reload()" style="font:inherit;padding:12px">Thử lại</button><script>
(async()=>{const status=document.getElementById('status');let finished=false;const done=()=>{if(finished)return;finished=true;status.textContent='Đã áp dụng bản sửa. Đang mở app…';location.replace('./');};try{const registration=await navigator.serviceWorker.register('./OneSignalSDKWorker.js',{scope:'./',updateViaCache:'none'});navigator.serviceWorker.addEventListener('controllerchange',done);function apply(){if(registration.waiting){status.textContent='Đang áp dụng bản sửa…';registration.waiting.postMessage({type:'HSK_ACTIVATE_UPDATE'});return true;}return false;}function watch(){const worker=registration.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed')apply();if(worker.state==='activated')done();if(worker.state==='redundant')status.textContent='Chưa tải được bản sửa. Hãy bấm Thử lại.';});}registration.addEventListener('updatefound',watch);watch();if(!apply()){await registration.update();watch();apply();}setTimeout(()=>{if(finished)return;if(registration.active&&!registration.installing&&!registration.waiting)done();else status.textContent='Đang chờ tải bản sửa. Nếu lâu quá, bấm Thử lại.';},20000);}catch(error){status.textContent='Không kết nối được bộ cập nhật. Kiểm tra mạng rồi bấm Thử lại.';}})();
</script></body></html>
