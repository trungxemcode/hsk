name: Build iOS SideStore
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-source.zip'
      - '.github/workflows/ios-build.yml'
      - 'app.js'
      - 'index.html'
      - 'loader.js'
      - 'style.css'
      - 'studio-layout.css'
      - 'studio.js'
      - 'planner.js'
      - 'planner-core.js'
      - '*Data.js'
      - 'words.js'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract iOS sources
        run: unzip -o ios-source.zip
      - name: Prepare offline vocabulary and web app
        run: |
          node ios/prepare-web.cjs
          python3 - <<'PYCODE'
          import json, shutil
          from pathlib import Path
          assets = json.loads(Path('app-version.json').read_text())['assets']
          for name in assets:
              if name not in ('index.html', 'loader.js'):
                  target = Path('ios/Web') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(name, target)
          PYCODE
      - name: Test SRS and notification question logic
        run: swiftc ios/HSK/StudyCore.swift ios/Tests/CoreTests.swift -o /tmp/hsk-core-tests && /tmp/hsk-core-tests
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build iPhone application (SideStore signs it locally)
        working-directory: ios
        run: xcodebuild -project HSK.xcodeproj -scheme HSK -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          test -f ios/build/Build/Products/Release-iphoneos/HSK.app/Web/index.html
          test -f ios/build/Build/Products/Release-iphoneos/HSK.app/Web/app.js
          test -f ios/build/Build/Products/Release-iphoneos/HSK.app/Web/words.js
          test -f ios/build/Build/Products/Release-iphoneos/HSK.app/notification-words.json
          mkdir -p dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/HSK.app dist/Payload/
          cd dist
          zip -qr HSK-SideStore.ipa Payload
          shasum -a 256 HSK-SideStore.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HSK-SideStore-IPA
          path: |
            dist/HSK-SideStore.ipa
            dist/SHA256.txt
          retention-days: 30
