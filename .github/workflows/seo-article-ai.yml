name: Auto HSK News Scanner & AI Publisher

on:
  schedule:
    # Tự động quét chinesetest.cn mỗi 2 tiếng một lần
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Chế độ chạy (auto-news: chỉ viết khi có tin mới trên chinesetest.cn)'
        required: false
        default: 'auto-news'
        type: choice
        options:
          - auto-news
          - force-latest-news
          - queue-or-custom
      voice:
        description: 'Văn phong viết lại bài'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - cam-nang-than-thien
          - ban-tin-phan-tich
          - hoi-dap-thuc-chien
          - ke-chuyen-truyen-cam-hung
      publish_mode:
        description: 'Cách đăng bài sau khi kiểm tra đạt chuẩn'
        required: false
        default: 'auto-publish'
        type: choice
        options:
          - auto-publish
          - pr-review
      topic:
        description: 'Chủ đề tự nhập (chỉ dùng khi mode = queue-or-custom)'
        required: false
        default: ''
      category:
        description: 'Chuyên mục (khi mode = queue-or-custom)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - ky-thi
          - diem-so
          - meo-hoc
          - ngu-phap
      source_url:
        description: 'Link nguồn bổ sung (tùy chọn)'
        required: false
        default: ''
      source_notes:
        description: 'Ghi chú chính thức bổ sung (tùy chọn)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-auto-news-publisher
  cancel-in-progress: false

jobs:
  scan-rewrite-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SEO_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright & JSDOM tools
        id: seo-deps-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hsk-seo-deps
          key: hsk-seo-deps-v1-${{ runner.os }}

      - name: Install Playwright & JSDOM tools
        if: steps.seo-deps-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --prefix /tmp/hsk-seo-deps playwright@1.56.1 jsdom

      - name: Ensure Chromium executable is available
        id: browser
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            NODE_PATH=/tmp/hsk-seo-deps/node_modules npx --yes playwright install --with-deps chromium
          fi
          echo "chrome_bin=$CHROME_BIN" >> "$GITHUB_OUTPUT"

      - name: Check GEMINI_API_KEY secret
        id: keycheck
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY chưa được cấu hình trong Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Scan chinesetest.cn & rewrite new articles in fresh Vietnamese voice
        if: steps.keycheck.outputs.has_key == 'true'
        env:
          NODE_PATH: /tmp/hsk-seo-deps/node_modules
          CHROME_EXECUTABLE: ${{ steps.browser.outputs.chrome_bin }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VOICE: ${{ inputs.voice }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_SOURCE_NOTES: ${{ inputs.source_notes }}
        run: |
          ARGS=()
          MODE="$INPUT_MODE"
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$MODE" ]; then
            MODE="auto-news"
          fi

          if [ "$MODE" = "auto-news" ]; then
            ARGS+=(--auto-news-scan)
          elif [ "$MODE" = "force-latest-news" ]; then
            ARGS+=(--force-latest-news)
          else
            if [ -n "$INPUT_TOPIC" ]; then
              ARGS+=(--topic "$INPUT_TOPIC")
            fi
            if [ -n "$INPUT_CATEGORY" ] && [ "$INPUT_CATEGORY" != "auto" ]; then
              ARGS+=(--category "$INPUT_CATEGORY")
            fi
            if [ -n "$INPUT_SOURCE_URL" ]; then
              ARGS+=(--source-url "$INPUT_SOURCE_URL")
            fi
            if [ -n "$INPUT_SOURCE_NOTES" ]; then
              ARGS+=(--source-notes "$INPUT_SOURCE_NOTES")
            fi
          fi

          if [ -n "$INPUT_VOICE" ] && [ "$INPUT_VOICE" != "auto" ]; then
            ARGS+=(--voice "$INPUT_VOICE")
          fi

          node tools/seo-articles/generate-ai-article.mjs "${ARGS[@]}"

      - name: Check whether new articles were produced
        id: changes
        run: |
          if [ -z "$(git status --porcelain content/seo-articles/articles.json bai-viet/ tin-tuc-hsk.html sitemap.xml)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Không có tin mới — trang giữ nguyên trạng thái hiện tại."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify SEO quality, bump PWA revision & preserve features
        if: steps.changes.outputs.has_changes == 'true'
        env:
          NODE_PATH: /tmp/hsk-seo-deps/node_modules
        run: |
          SLUG=$(node -e "const d=require('./content/seo-articles/articles.json'); console.log(d.articles[0].slug);")
          BRANCH="seo/auto-news-${SLUG}-$(date +%Y%m%d%H%M)"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
          echo "slug=$SLUG" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"

          node --test tools/seo-articles/test-seo-articles.mjs
          python tools/prepare-pwa-release.py --keep-release --note "Cập nhật tin tức HSK tự động"
          node tools/check-seo-entry-dom.cjs
          python tools/check-pwa-release.py --base origin/main
          python tools/check-feature-preservation.py --base origin/main

      - name: Commit & publish automatically to live site (or fallback to auto-merge PR)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SEO_PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: |
          TITLE=$(node -e "const d=require('./content/seo-articles/articles.json'); console.log(d.articles[0].title);")
          VOICE=$(node -e "const d=require('./content/seo-articles/articles.json'); console.log(d.articles[0].editorialVoice || 'auto');")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/seo-articles/ tin-tuc-hsk.html bai-viet/ sitemap.xml app-version.json offline.js offline-worker.js OneSignalSDKWorker.js
          git commit -m "seo: tự động đăng bài HSK (${VOICE}) — ${TITLE}"

          if [ "$PUBLISH_MODE" != "pr-review" ]; then
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "PUBLISHED DIRECTLY TO main: ${TITLE}"
              exit 0
            fi
            echo "Direct push to protected main blocked; falling back to auto-merge Pull Request."
          fi

          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "seo: tự động đăng tin HSK — ${TITLE}" \
            --body "$(cat <<EOF
          ## Bài viết tin tức HSK tự động (quét chinesetest.cn mỗi 2h)

          - **Tiêu đề:** ${TITLE}
          - **Văn phong AI:** \`${VOICE}\`
          - **URL bài viết:** \`https://hskfreelearningai.pages.dev/bai-viet/${slug}\`
          - **Tự động cập nhật:** \`seen-news.json\`, \`tin-tuc-hsk.html\`, \`sitemap.xml\`, và PWA revision.

          ## Khai báo giao diện (Layout & UI Scope Declaration)
          - **Phạm vi thay đổi:** Chỉ thêm bài viết SEO tĩnh trong \`bai-viet/\` và cập nhật danh sách tại \`tin-tuc-hsk.html\`.
          - **Ứng dụng học chính (\`app-hoc-hsk.html\` — 22 route SPA):** Không thay đổi giao diện.
          EOF
          )")

          if [ "$PUBLISH_MODE" != "pr-review" ]; then
            gh pr merge "$PR_URL" --auto --squash --delete-branch || gh pr merge "$PR_URL" --squash --delete-branch || true
          fi
