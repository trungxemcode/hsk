name: Studio layout checks
on:
  pull_request:
    paths: ['home-overview*', 'tools/check-home-overview-ui.cjs', 'tools/check-press-shape-ui.cjs', 'mobile-ux*', 'tools/check-mobile-ux*.cjs', 'tools/check-mobile-flow*.cjs', 'passive*', 'tools/check-passive*.cjs', 'app.js', 'placement*', 'tools/check-placement*.cjs', 'style.css', 'mobile-layout.css', 'ui-buttons.css', 'handwriting.css', 'speech.css', 'lesson-chat.css', 'tools/check-design-tokens.cjs', 'study-sync*', 'ui-buttons.css', 'notebook*', 'backup*', 'tools/check-notebook*.cjs', 'account.js', 'index.html', 'studio.js', 'planner.js', 'planner-core.js', 'exam*', 'drive-exam*', 'drive-audio*', 'open-dictionary*', 'content/open-dictionary/**', 'tools/check-open-dictionary*.cjs', 'tools/build-open-dictionary.py', 'content/drive-hsk/**', 'tools/import-drive-hsk.py', 'ai-coach*', 'coach-profile.js', 'lessons.js', 'lessons-data.json', 'lesson-mastery.js', 'lesson-mini*', 'lesson-guided*', 'tools/check-lesson-guided-ui.cjs', 'account-core.js', 'server/**', 'studio-layout.css', 'tools/check-studio*.cjs', 'tools/check-exam*.cjs', 'tools/check-ai-coach*.cjs', 'tools/check-lesson-mini*.cjs', 'tools/check-reading-dom.cjs', 'real-reading*', 'tools/check-real-reading*.cjs', 'practice-games*', 'practice-selector*', 'study4-practice.js', 'tools/check-practice-games*.cjs', 'tools/check-practice-picker-ui.cjs', '.github/workflows/studio-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --prefix /tmp/hsk-tests jsdom@26.1.0 playwright@1.56.1
      - name: Install Chinese fonts for visual checks
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Functional regression checks
        env:
          NODE_PATH: /tmp/hsk-tests/node_modules
        run: |
          node tools/check-design-tokens.cjs
          node tools/check-placement-dom.cjs
          node tools/check-placement-route-dom.cjs
          node tools/check-passive-dom.cjs
          node --test server/*.test.mjs
          node tools/check-speech-dom.cjs
          node tools/check-reading-dom.cjs
          node tools/check-studio-dom.cjs
          node tools/check-notebook-dom.cjs
          node tools/check-notebook-factory-dom.cjs
          node tools/check-planner-dom.cjs
          node tools/check-study-sync-dom.cjs
          python3 tools/check-pwa-release.py
          python3 -m unittest discover -s tools -p 'test_pwa_release*.py'
          node tools/check-update-dom.cjs
          node tools/check-ai-coach-dom.cjs
          node tools/check-exam-dom.cjs
          node tools/check-open-dictionary-dom.cjs
          node tools/check-lesson-mini-dom.cjs
          node tools/check-practice-games-core.cjs
          node tools/check-real-reading-variety.cjs
          python3 -m unittest discover -s tools -p 'test_update*.py'
      - name: Browser layout and controls
        env:
          NODE_PATH: /tmp/hsk-tests/node_modules
        run: |
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-lesson-guided-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-press-shape-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-shared-press-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-home-overview-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-clean-ux-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-ai-loading-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-responsive-goal-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-mobile-ux-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-mobile-flow-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-writing-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-placement-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-placement-route-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-placement-feedback-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-placement-adaptive-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-passive-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-search-tabs-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-practice-games-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-practice-picker-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-real-reading-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-goal-scope-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-ios-push-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-studio-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-dark-contrast-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-notebook-ui.cjs
          CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-notebook-factory-ui.cjs
      - name: Keep layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-layout-screenshots
          path: |
            /tmp/studio-*.png
            /tmp/mobile-ux-*.png
            /tmp/mobile-flow-*.png
            /tmp/clean-*.png
            /tmp/overview-*.png
            /tmp/press-shape-*.png
            /tmp/notebook-*.png
            /tmp/placement-feedback-*.png
            /tmp/placement-adaptive-*.png
          retention-days: 7
