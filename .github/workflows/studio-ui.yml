name: Studio layout checks
on:
  pull_request:
    # Visual-layer changes must run the same responsive and interaction checks.
    paths: ['redesign.css', 'redesign.js', 'tools/check-redesign-ui.cjs', 'src/**', 'content/data/**', 'loader.js', 'tools/pwa-assets.json', 'home-overview*', 'tools/check-home-overview-ui.cjs', 'tools/check-desktop-layout-polish-ui.cjs', 'tools/check-press-shape-ui.cjs', 'mobile-ux*', 'tools/check-mobile-ux*.cjs', 'tools/check-ios-animation-ui.cjs', 'tools/check-mobile-flow*.cjs', 'passive*', 'tools/check-passive*.cjs', 'app.js', 'placement*', 'tools/check-placement*.cjs', 'style.css', 'mobile-layout.css', 'ui-buttons.css', 'handwriting.css', 'speech.css', 'lesson-chat.css', 'tools/check-design-tokens.cjs', 'study-sync*', 'ui-buttons.css', 'notebook*', 'backup*', 'tools/check-notebook*.cjs', 'account.js', 'index.html', 'studio.js', 'planner.js', 'planner-core.js', 'exam*', 'drive-exam*', 'drive-audio*', 'open-dictionary*', 'content/open-dictionary/**', 'tools/check-open-dictionary*.cjs', 'tools/build-open-dictionary.py', 'content/drive-hsk/**', 'tools/import-drive-hsk.py', 'ai-coach*', 'coach-profile.js', 'lessons.js', 'lessons-data.json', 'lesson-mastery.js', 'lesson-mini*', 'lesson-guided*', 'tools/check-lesson-guided-ui.cjs', 'account-core.js', 'server/**', 'studio-layout.css', 'tools/check-studio*.cjs', 'tools/check-exam*.cjs', 'tools/check-ai-coach*.cjs', 'tools/check-lesson-mini*.cjs', 'tools/check-reading-dom.cjs', 'real-reading*', 'tools/check-real-reading*.cjs', 'practice-games*', 'practice-selector*', 'study4-practice.js', 'tools/check-practice-games*.cjs', 'tools/check-practice-picker-ui.cjs', '.github/workflows/studio-ui.yml', 'tools/ci-suites.json', 'tools/*ci-shard*.cjs', 'tools/run-ci-suite.cjs', 'tools/check-ci-reports.cjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout-shards:
    name: layout-shard (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install test dependencies
      run: npm install --prefix /tmp/hsk-tests jsdom@26.1.0 playwright@1.56.1
    - name: Install Chinese fonts for visual checks
      continue-on-error: true
      timeout-minutes: 2
      run: sudo apt-get update -qq -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 && sudo apt-get install -y --no-install-recommends
        fonts-noto-cjk || true
    - name: Run assigned tests
      env:
        NODE_PATH: /tmp/hsk-tests/node_modules
        SHARD: ${{ matrix.shard }}
      run: node tools/run-ci-suite.cjs studio "$SHARD" 6 /tmp/studio-shard
    - name: Keep layout screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: studio-layout-screenshots-${{ matrix.shard }}-${{ github.sha }}
        path: |-
          /tmp/studio-*.png
          /tmp/music-*.png
          /tmp/mobile-ux-*.png
          /tmp/mobile-flow-*.png
          /tmp/clean-*.png
          /tmp/overview-*.png
          /tmp/layout-polish-*.png
          /tmp/press-shape-*.png
          /tmp/notebook-*.png
          /tmp/placement-feedback-*.png
          /tmp/placement-adaptive-*.png

          /tmp/studio-shard/report.json
        retention-days: 7
  layout:
    name: layout
    needs: layout-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify partition guards
      run: node --test tools/test-ci-sharding.cjs
    - uses: actions/download-artifact@v4
      with:
        pattern: studio-layout-screenshots-*-${{ github.sha }}
        path: /tmp/ci-reports
    - name: Verify complete test inventory
      run: node tools/check-ci-reports.cjs suite studio 6 /tmp/ci-reports "$GITHUB_SHA"
    - name: Require every parallel job to succeed
      if: always()
      env:
        SHARD_RESULT: ${{ needs.layout-shards.result }}
      run: test "$SHARD_RESULT" = success
