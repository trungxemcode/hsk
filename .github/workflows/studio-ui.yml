name: Studio layout checks
on:
  pull_request:
    paths: ['index.html', 'studio.js', 'planner.js', 'planner-core.js', 'exam*', 'drive-exam*', 'drive-audio*', 'content/drive-hsk/**', 'tools/import-drive-hsk.py', 'ai-coach*', 'coach-profile.js', 'lessons.js', 'lessons-data.json', 'lesson-mastery.js', 'lesson-mini*', 'account-core.js', 'server/**', 'studio-layout.css', 'tools/check-studio*.cjs', 'tools/check-exam*.cjs', 'tools/check-ai-coach*.cjs', 'tools/check-lesson-mini*.cjs', 'tools/check-reading-dom.cjs', '.github/workflows/studio-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --prefix /tmp/hsk-tests jsdom@26.1.0 playwright@1.56.1
      - name: Install Chinese fonts for visual checks
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Functional regression checks
        env:
          NODE_PATH: /tmp/hsk-tests/node_modules
        run: |
          node --test server/*.test.mjs
          node tools/check-speech-dom.cjs
          node tools/check-reading-dom.cjs
          node tools/check-studio-dom.cjs
          node tools/check-planner-dom.cjs
          node tools/check-update-dom.cjs
          node tools/check-ai-coach-dom.cjs
          node tools/check-exam-dom.cjs
          node tools/check-lesson-mini-dom.cjs
          python3 -m unittest discover -s tools -p 'test_update*.py'
      - name: Browser layout and controls
        env:
          NODE_PATH: /tmp/hsk-tests/node_modules
        run: CHROME_EXECUTABLE="$(command -v google-chrome)" node tools/check-studio-ui.cjs
      - name: Keep layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-layout-screenshots
          path: /tmp/studio-*.png
          retention-days: 7
