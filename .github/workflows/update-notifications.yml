name: Notify web update
on:
  push:
    branches: [main]
    paths: ['app-version.json', '.github/workflows/update-notifications.yml']
permissions:
  contents: read
concurrency:
  group: web-update-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify live version and notify opted-in devices
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python3 send-update-notification.py
