name: Deploy SEO editorial Worker
on:
  push:
    branches: [main]
    paths:
      - 'server/seo-editorial/**'
      - '.github/workflows/deploy-seo-editorial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-editorial-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test SEO Worker
        run: node --test server/seo-editorial/worker.test.mjs
      - name: Deploy SEO editorial Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.168.0 deploy --config server/seo-editorial/wrangler.jsonc --keep-vars
      - name: Verify MCP and approved queue
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';

          const base = 'https://hsk-seo-editorial.trung-hsk668.workers.dev';
          async function get(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(8000) });
            assert.equal(response.status, 200, path);
            return response.json();
          }

          for (let attempt = 1; ; attempt += 1) {
            try {
              const [health, queue, api] = await Promise.all([
                get('/health'), get('/public/approved-queue'), get('/api/chatgpt/openapi.json'),
              ]);
              assert.equal(health.service, 'hsk-seo-editorial');
              assert.ok(health.chatgptGateway?.protocols?.includes('mcp-streamable-http'));
              assert.ok(queue.ok && Array.isArray(queue.items));
              assert.equal(queue.count, queue.items.length);
              assert.equal(api.openapi, '3.1.0');
              console.log('Verified SEO Worker, MCP and approved queue.');
              break;
            } catch (error) {
              if (attempt === 8) throw error;
              await delay(5000);
            }
          }
          JS
