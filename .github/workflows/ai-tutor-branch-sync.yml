name: Keep AI Tutor branch aligned after squash merge
on:
  pull_request_target:
    types: [closed]
  schedule:
    # Safety net for repositories that auto-delete merged branches.
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-tutor-post-merge-sync
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/ai-tutor-v5-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Attach verified squash ancestry, or restore an auto-deleted branch
        env:
          AI_TUTOR_MERGED_HEAD: ${{ github.event.pull_request.head.sha }}
          AI_TUTOR_SQUASH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          AI_TUTOR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/sync-ai-tutor-after-squash.sh
  restore-missing-branch:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Re-create the AI Tutor branch only when missing
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git ls-remote --exit-code --heads origin 'refs/heads/feat/ai-tutor-v5-hardening' >/dev/null; then
            echo 'AI Tutor feature branch already exists; no changes.'
            exit 0
          else
            result=$?
            test "$result" = 2
          fi
          git push origin 'refs/remotes/origin/main:refs/heads/feat/ai-tutor-v5-hardening'
          echo 'AI Tutor feature branch recreated from main.'
