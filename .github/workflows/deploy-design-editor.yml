name: Deploy UX UI editor
on:
  pull_request:
    paths: ['.github/workflows/deploy-design-editor.yml', 'tools/deploy-design-editor.py', 'tools/verify-live-design-editor.py', 'tools/test_design_deployment.py']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hsk-design-editor-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test live deployment verification
        run: python -m unittest discover -s tools -p test_design_deployment.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Add Actions secret CLOUDFLARE_API_TOKEN (Workers Editor for hsk-ui-designer).'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Add Actions secret CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
      - name: Validate release and design backend
        run: |
          python tools/check-pwa-release.py
          node tools/check-home-designer-core.cjs
          node --test server/design-worker.test.mjs server/design-chatgpt.test.mjs
      - name: Pack public app and editor assets
        run: python tools/pack-design-editor.py
      - name: Bundle dedicated editor Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/hsk-design-bundle --config server/design/wrangler.jsonc
      - name: Publish dedicated editor Worker
        run: python tools/deploy-design-editor.py --account-id "$CLOUDFLARE_ACCOUNT_ID" --bundle /tmp/hsk-design-bundle/worker.js
      - name: Verify live release and editor assets
        run: python tools/verify-live-design-editor.py
      - name: Deployment link
        run: echo 'Editor updated — https://hsk-ui-designer.trung-hsk668.workers.dev/' >> "$GITHUB_STEP_SUMMARY"
